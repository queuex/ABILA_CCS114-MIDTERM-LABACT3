<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hopipa Games | Login/Signup</title>
    <link rel="icon" type="image/x-icon" href="images/logo-icon.png">

    <!-- Bootstrap5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="steam-bg min-vh-100 d-flex align-items-center py-4">

    <div class="container">>
        <div class="card bg-steam-panel border-danger border-opacity-25 rounded-2 overflow-hidden shadow-lg">
            <div class="row g-0">
                
                <div class="col-lg-6 d-none d-lg-block hopipa-side-banner position-relative p-5">
                    <div class="position-relative z-1 d-flex flex-column h-100 justify-content-between text-white" style="text-align: center;"><div></div>
                        
                        <div class="small text-secondary">
                            <img src="images/logo-icon.png" alt="logo" style="width: 128px;">
                            <h1 class="text-danger">
                            HOPIPA GAMES
                            </h1>
                            <p class="lead text-light opacity-75">Your ultimate digital gaming library. Connect, discover, and download thousands of PC titles from global publishers.</p>
                            © 2026 Hopipa Games Distribution Inc.
                        </div>
                        <div></div>
                    </div>
                </div>

                <!-- FORM -->
                <div class="col-lg-6 p-4 p-sm-5 bg-steam-dark d-flex flex-column justify-content-center">
                    
                    <div class="text-center text-lg-start mb-4">
                        <h3 class="fw-bold text-light text-uppercase tracking-wide mb-1">Welcome back!</h3>
                        <p class="text-secondary small">Sign in to sync your library, cart, and wishlist</p>
                        
                        <!-- Nav Pills Component -->
                        <ul class="nav nav-pills nav-justified mt-3 hopipa-pills" id="authTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active rounded-1 fw-bold text-uppercase" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab">Log In</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link rounded-1 fw-bold text-uppercase" id="signup-tab" data-bs-toggle="tab" data-bs-target="#signup-pane" type="button" role="tab">Sign Up</button>
                            </li>
                        </ul>
                    </div>

                    <div class="tab-content" id="authTabContent">
                        
                        <!-- LOGIN FORM -->
                        <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                            <form>
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label text-light small text-uppercase fw-semibold">Email or Username</label>
                                    <input type="text" class="form-control hopipa-input rounded-1" id="loginEmail" placeholder="player123@gmail.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="loginPassword" class="form-label text-light small text-uppercase fw-semibold">Password</label>
                                    <input type="password" class="form-control hopipa-input rounded-1" id="loginPassword" required>
                                </div>
                                <div class="mb-4 form-check">
                                    <input type="checkbox" class="form-check-input hopipa-check" id="rememberMe">
                                    <label class="form-check-label text-secondary small" for="rememberMe">Remember me on this device</label>
                                </div>
                                <a href="landing.html" class="btn btn-steam-red w-100 py-2.5 rounded-1 fw-bold text-uppercase shadow-sm">Log In</a>
                            </form>
                        </div>

                        <!-- SIGN-UP FORM -->
                        <div class="tab-pane fade" id="signup-pane" role="tabpanel">
                            <form>
                                <div class="row g-2 mb-3">
                                    <div class="col-md-6">
                                        <label for="firstName" class="form-label text-light small text-uppercase fw-semibold">First Name</label>
                                        <input type="text" class="form-control hopipa-input rounded-1" id="firstName" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="lastName" class="form-label text-light small text-uppercase fw-semibold">Last Name</label>
                                        <input type="text" class="form-control hopipa-input rounded-1" id="lastName" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label d-block text-light small text-uppercase fw-semibold">Gender</label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input hopipa-check" type="radio" name="gender" id="genderMale" value="male">
                                        <label class="form-check-label text-secondary small" for="genderMale">Male</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input hopipa-check" type="radio" name="gender" id="genderFemale" value="female">
                                        <label class="form-check-label text-secondary small" for="genderFemale">Female</label>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="signupEmail" class="form-label text-light small text-uppercase fw-semibold">Email Address</label>
                                    <input type="email" class="form-control hopipa-input rounded-1" id="signupEmail" required>
                                </div>
                                <div class="row g-2 mb-3">
                                    <div class="col-md-6">
                                        <label for="signupPassword" class="form-label text-light small text-uppercase fw-semibold">Password</label>
                                        <input type="password" class="form-control hopipa-input rounded-1" id="signupPassword" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="confirmPassword" class="form-label text-light small text-uppercase fw-semibold">Confirm Password</label>
                                        <input type="password" class="form-control hopipa-input rounded-1" id="confirmPassword" required>
                                    </div>
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input hopipa-check" id="terms" required>
                                    <label class="form-check-label text-secondary small" for="terms">
                                        I agree to the Subscriber Agreement
                                    </label>
                                </div>
                                <button type="submit" class="btn btn-steam-red w-100 py-2.5 rounded-1 fw-bold text-uppercase shadow-sm">Create Account</button>
                            </form>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap5 Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
